<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр организации</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #printableArea, #printableArea * {
                visibility: visible;
            }
            #printableArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
        }
        .detail-row {
            margin-bottom: 1rem;
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
        }
        .detail-label {
            font-weight: bold;
            color: #333;
            min-width: 200px;
            display: inline-block;
        }
        .action-buttons {
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .action-buttons .btn {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
<main class="container">
    <div class="no-print" style="margin-bottom: 1rem;">
        <a th:href="@{/organizations}" class="btn">Назад</a>
    </div>
    
    <div id="printableArea">
        <h2 th:text="${organization.name}">Организация</h2>
        
        <div class="detail-row">
            <span class="detail-label">Краткое название:</span>
            <span th:text="${organization.shortName}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Регистрационный номер:</span>
            <span th:text="${organization.registrationNumber != null ? organization.registrationNumber : '-'}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Тип:</span>
            <span th:text="${organization.type != null ? organization.type.name : '-'}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Город:</span>
            <span th:text="${organization.city}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Адрес:</span>
            <span th:text="${organization.address}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Руководитель:</span>
            <span th:text="${organization.directorName}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Телефон:</span>
            <span th:text="${organization.phone}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Email:</span>
            <span th:text="${organization.email}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Количество сотрудников:</span>
            <span th:text="${organization.employeeCount}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Категория риска:</span>
            <span th:text="${organization.riskCategory == 'low' ? 'Низкий' : (organization.riskCategory == 'medium' ? 'Средний' : (organization.riskCategory == 'high' ? 'Высокий' : (organization.riskCategory == 'critical' ? 'Критический' : organization.riskCategory)))}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Статус:</span>
            <span th:text="${organization.isActive ? 'Активна' : 'Не активна'}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Примечания:</span>
            <span th:text="${organization.notes != null && !organization.notes.isEmpty() ? organization.notes : '-'}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Дата создания:</span>
            <span th:text="${organization.createdAt != null ? #temporals.format(organization.createdAt, 'dd.MM.yyyy') : '-'}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Дата обновления:</span>
            <span th:text="${organization.updatedAt != null ? #temporals.format(organization.updatedAt, 'dd.MM.yyyy') : '-'}"></span>
        </div>
    </div>
    
    <div class="action-buttons no-print">
        <button onclick="window.print()" class="btn">🖨️ Печать</button>
        <button onclick="sendByEmail()" class="btn">📧 Отправить по почте</button>
        <a th:href="@{/organizations/{id}/edit(id=${organization.id})}" class="btn manage-organizations">Редактировать</a>
        <form th:action="@{/organizations/{id}/delete(id=${organization.id})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger manage-organizations" onclick="return confirm('Вы уверены?');">Удалить</button>
        </form>
    </div>
</main>

<script th:src="@{/js/auth.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () { 
        // Страница просмотра доступна всем без аутентификации
    });
    
    function sendByEmail() {
        const subject = encodeURIComponent('Информация об организации: ' + '[[${organization.name}]]');
        const body = encodeURIComponent(
            'Организация: [[${organization.name}]]\n' +
            'Краткое название: [[${organization.shortName}]]\n' +
            'Регистрационный номер: [[${organization.registrationNumber != null ? organization.registrationNumber : '-'}]]\n' +
            'Тип: [[${organization.type != null ? organization.type.name : '-'}]]\n' +
            'Город: [[${organization.city}]]\n' +
            'Адрес: [[${organization.address}]]\n' +
            'Руководитель: [[${organization.directorName}]]\n' +
            'Телефон: [[${organization.phone}]]\n' +
            'Email: [[${organization.email}]]\n' +
            'Количество сотрудников: [[${organization.employeeCount}]]\n' +
            'Категория риска: [[${organization.riskCategory}]]\n' +
            'Статус: [[${organization.isActive ? 'Активна' : 'Не активна'}]]\n' +
            'Примечания: [[${organization.notes != null && !organization.notes.isEmpty() ? organization.notes : '-'}]]'
        );
        window.location.href = 'mailto:?subject=' + subject + '&body=' + body;
    }
</script>
</body>
</html>
