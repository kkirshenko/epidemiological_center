name: sanepidcenter

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sanepidcenter-db
    environment:
      POSTGRES_DB: sanepidcenter_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sanepidcenter-network

  # Spring Boot Application
  app:
    image: sanepidcenter-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sanepidcenter-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: SanEpidCenterSecretKeyForJWTTokenGenerationAndValidation2024VeryLongSecretKey
      JWT_EXPIRATION: 86400000
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sanepidcenter-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  sanepidcenter-network:
    driver: bridge
