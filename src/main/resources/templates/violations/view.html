<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр нарушения</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #printableArea, #printableArea * {
                visibility: visible;
            }
            #printableArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
        }
        .detail-row {
            margin-bottom: 1rem;
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
        }
        .detail-label {
            font-weight: bold;
            color: #333;
            min-width: 200px;
            display: inline-block;
        }
        .action-buttons {
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .action-buttons .btn {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
<main class="container">
    <div class="no-print" style="margin-bottom: 1rem;">
        <a th:href="@{/violations}" class="btn">Назад</a>
    </div>
    
    <div id="printableArea">
        <h2>Нарушение</h2>
        
        <div class="detail-row">
            <span class="detail-label">Проверка:</span>
            <span th:text="${violation.inspection != null && violation.inspection.organization != null ? violation.inspection.organization.name : '-'}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Код:</span>
            <span th:text="${violation.id}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Описание:</span>
            <span th:text="${violation.description}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Серьёзность:</span>
            <span th:text="${violation.severity}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Статья:</span>
            <span th:text="${violation.articleReference}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Срок устранения:</span>
            <span th:text="${violation.resolved && resolutionDays != null ? resolutionDays + ' дн.' : '-'}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Статус:</span>
            <span th:text="${violation.resolved ? 'Устранено' : 'Не устранено'}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Примечания об устранении:</span>
            <span th:text="${violation.resolutionNotes != null && !violation.resolutionNotes.isEmpty() ? violation.resolutionNotes : '-'}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Дата создания:</span>
            <span th:text="${violation.createdAt != null ? #temporals.format(violation.createdAt, 'dd.MM.yyyy') : '-'}"></span>
        </div>
        
        <div class="detail-row">
            <span class="detail-label">Дата обновления:</span>
            <span th:text="${violation.updatedAt != null ? #temporals.format(violation.updatedAt, 'dd.MM.yyyy') : '-'}"></span>
        </div>
    </div>
    
    <div class="action-buttons no-print">
        <button onclick="window.print()" class="btn">🖨️ Печать</button>
        <button onclick="sendByEmail()" class="btn">📧 Отправить по почте</button>
        <a th:if="${violation.id != null}" th:href="@{/violations/{id}/edit(id=${violation.id})}" class="btn manage-violations">✏️ Редактировать</a>
        <form th:if="${violation.id != null}" th:action="@{/violations/{id}/delete(id=${violation.id})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger manage-violations" onclick="return confirm('Вы уверены?');">🗑️ Удалить</button>
        </form>
    </div>
</main>

<script th:src="@{/js/auth.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () { 
        // Страница просмотра доступна всем без аутентификации
    });
    
    function sendByEmail() {
        const orgName = '[[${violation.inspection != null && violation.inspection.organization != null ? violation.inspection.organization.name : '-'}]]';
        const subject = encodeURIComponent('Информация о нарушении: ' + orgName);
        
        const body = encodeURIComponent(
            'Нарушение в организации: ' + orgName + '\n' +
            'Код: [[${violation.id}]]\n' +
            'Описание: [[${violation.description}]]\n' +
            'Серьёзность: [[${violation.severity}]]\n' +
            'Статья: [[${violation.articleReference}]]\n' +
            'Срок устранения: [[${violation.resolved && resolutionDays != null ? resolutionDays + ' дн.' : '-'}]]\n' +
            'Статус: [[${violation.resolved ? 'Устранено' : 'Не устранено'}]]\n' +
            'Примечания об устранении: [[${violation.resolutionNotes != null && !violation.resolutionNotes.isEmpty() ? violation.resolutionNotes : '-'}]]'
        );
        window.location.href = 'mailto:?subject=' + subject + '&body=' + body;
    }
</script>
</body>
</html>
