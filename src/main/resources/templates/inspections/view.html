<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр проверки</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #printableArea, #printableArea * {
                visibility: visible;
            }
            #printableArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
        }
        .detail-row {
            margin-bottom: 1rem;
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
        }
        .detail-label {
            font-weight: bold;
            color: #333;
            min-width: 220px;
            display: inline-block;
        }
        .action-buttons {
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .action-buttons .btn {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
<main class="container">
    <div class="no-print" style="margin-bottom: 1rem;">
        <a th:href="@{/inspections}" class="btn">Назад</a>
    </div>

    <div id="printableArea">
        <h2>Проверка</h2>

        <div class="detail-row">
            <span class="detail-label">Организация:</span>
            <span th:text="${inspection.organization != null ? inspection.organization.name : '-'}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Тип проверки:</span>
            <span th:text="${inspection.type != null ? inspection.type.name : '-'}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Проверяющий:</span>
            <span th:text="${inspection.inspector != null ? inspection.inspector.fullName : '-'}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Плановая дата:</span>
            <span th:text="${inspection.scheduledDate != null ? inspection.scheduledDate : '-'}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Дата начала:</span>
            <span th:text="${inspection.startDate != null ? inspection.startDate : '-'}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Дата окончания:</span>
            <span th:text="${inspection.endDate != null ? inspection.endDate : '-'}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Статус:</span>
            <span th:text="${inspection.status == 'planned' ? 'Запланирована' : (inspection.status == 'in_progress' ? 'В процессе' : (inspection.status == 'completed' ? 'Завершена' : (inspection.status == 'cancelled' ? 'Отменена' : inspection.status)))}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Результат:</span>
            <span th:text="${inspection.result == 'pending' ? 'Ожидается' : (inspection.result == 'satisfactory' ? 'Удовлетворительно' : (inspection.result == 'unsatisfactory' ? 'Неудовлетворительно' : (inspection.result == 'critical' ? 'Критическое' : inspection.result)))}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Номер акта:</span>
            <span th:text="${inspection.actNumber != null ? inspection.actNumber : '-'}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Краткое заключение:</span>
            <span th:text="${inspection.findingsSummary != null && !inspection.findingsSummary.isEmpty() ? inspection.findingsSummary : '-'}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Рекомендации:</span>
            <span th:text="${inspection.recommendations != null && !inspection.recommendations.isEmpty() ? inspection.recommendations : '-'}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Дата создания:</span>
            <span th:text="${inspection.createdAt != null ? #temporals.format(inspection.createdAt, 'dd.MM.yyyy') : '-'}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Дата обновления:</span>
            <span th:text="${inspection.updatedAt != null ? #temporals.format(inspection.updatedAt, 'dd.MM.yyyy') : '-'}"></span>
        </div>
    </div>

    <div class="action-buttons no-print">
        <button onclick="window.print()" class="btn">🖨️ Печать</button>
        <a th:if="${inspection.id != null}" th:href="@{/inspections/{id}/edit(id=${inspection.id})}" class="btn manage-inspections">Редактировать</a>
        <form th:if="${inspection.id != null}" th:action="@{/inspections/{id}/delete(id=${inspection.id})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger manage-inspections" onclick="return confirm('Вы уверены?');">Удалить</button>
        </form>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        requireAuth();
    });
</script>
</body>
</html>
