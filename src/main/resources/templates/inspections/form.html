<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка - СанЭпидЦентр</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">СанЭпидЦентр</h1>
            <ul class="nav-links">
                <li><a th:href="@{/}">Главная</a></li>
                <li><a th:href="@{/organizations}">Организации</a></li>
                <li><a th:href="@{/inspections}">Проверки</a></li>
                <li><a th:href="@{/violations}">Нарушения</a></li>
                <li class="admin-only" style="display:none;"><a th:href="@{/register}">Добавить пользователя</a></li>
            </ul>
        </div>
    </nav>
</header>

<main class="container">
    <section class="page-header">
        <h2>Форма проверки</h2>
        <a th:href="@{/inspections}" class="btn">Назад к списку</a>
    </section>

    <form th:action="${inspection.id} != null ? @{/inspections/{id}(id=${inspection.id})} : @{/inspections}" method="post" th:object="${inspection}">
        <div class="form-group">
            <label for="organization">Организация *</label>
            <select id="organization" th:field="*{organization.id}" required>
                <option value="">Выберите организацию</option>
                <option th:each="org : ${organizations}" th:value="${org.id}" th:text="${org.name}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="type">Тип проверки *</label>
            <select id="type" th:field="*{type.id}" required>
                <option value="">Выберите тип</option>
                <option th:each="t : ${inspectionTypes}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="inspector">Проверяющий *</label>
            <select id="inspector" th:field="*{inspector.id}" required>
                <option value="">Выберите проверяющего</option>
                <option th:each="i : ${inspectors}" th:value="${i.id}" th:text="${i.fullName}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="scheduledDate">Плановая дата *</label>
            <input id="scheduledDate"
                   type="date"
                   name="scheduledDate"
                   th:value="${inspection.scheduledDate != null ? #temporals.format(inspection.scheduledDate, 'yyyy-MM-dd') : ''}"
                   required>
        </div>

        <div class="form-group">
            <label for="status">Статус *</label>
            <select id="status" th:field="*{status}" required>
                <option value="planned">Запланирована</option>
                <option value="in_progress">В процессе</option>
                <option value="completed">Завершена</option>
                <option value="cancelled">Отменена</option>
            </select>
        </div>

        <div class="form-group">
            <label for="result">Результат *</label>
            <select id="result" th:field="*{result}" required>
                <option value="pending">Ожидается</option>
                <option value="satisfactory">Удовлетворительно</option>
                <option value="unsatisfactory">Неудовлетворительно</option>
                <option value="critical">Критическое</option>
            </select>
        </div>

        <div class="form-group">
            <label for="findingsSummary">Краткое заключение</label>
            <textarea id="findingsSummary" th:field="*{findingsSummary}"></textarea>
        </div>

        <div class="form-group">
            <label for="recommendations">Рекомендации</label>
            <textarea id="recommendations" th:field="*{recommendations}"></textarea>
        </div>

        <div class="form-group">
            <label for="actNumber">Номер акта</label>
            <input id="actNumber" type="text" th:field="*{actNumber}">
        </div>

        <button type="submit" class="btn">Сохранить</button>
    </form>
</main>

<script th:src="@{/js/auth.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        requireAuth();

        const statusSelect = document.getElementById('status');
        const resultSelect = document.getElementById('result');
        if (!statusSelect || !resultSelect) {
            return;
        }

        const nonCompletedStatuses = ['planned', 'in_progress', 'cancelled'];

        function syncStatusByResult() {
            const isPending = resultSelect.value === 'pending';
            Array.from(statusSelect.options).forEach(option => {
                if (option.value === 'completed') {
                    option.disabled = isPending;
                }
            });

            if (isPending) {
                if (statusSelect.value === 'completed') {
                    statusSelect.value = 'planned';
                }
                return;
            }

            statusSelect.value = 'completed';
        }

        function syncResultByStatus() {
            if (statusSelect.value === 'completed' && resultSelect.value === 'pending') {
                resultSelect.value = 'satisfactory';
            }
            if (statusSelect.value !== 'completed' && resultSelect.value !== 'pending') {
                resultSelect.value = 'pending';
                statusSelect.value = nonCompletedStatuses.includes(statusSelect.value) ? statusSelect.value : 'planned';
            }
        }

        resultSelect.addEventListener('change', syncStatusByResult);
        statusSelect.addEventListener('change', syncResultByStatus);
        syncStatusByResult();
    });
</script>
</body>
</html>
