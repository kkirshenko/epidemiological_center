<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование нарушения - СанЭпидЦентр</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">СанЭпидЦентр</h1>
            <ul class="nav-links">
                <li><a th:href="@{/}">Главная</a></li>
                <li><a th:href="@{/organizations}">Организации</a></li>
                <li><a th:href="@{/inspections}">Проверки</a></li>
                <li><a th:href="@{/violations}">Нарушения</a></li>
                <li class="admin-only" style="display:none;"><a th:href="@{/register}">Добавить пользователя</a></li>
            </ul>
        </div>
    </nav>
</header>

<main class="container">
    <section class="page-header">
        <h2>Редактирование нарушения</h2>
        <a th:href="@{/violations}" class="btn">Назад к списку</a>
    </section>

    <form th:action="${violation.id} != null ? @{/violations/{id}/edit(id=${violation.id})} : @{/violations}" method="post">
        <div class="form-group">
            <label for="inspectionId">Проверка *</label>
            <select id="inspectionId" name="inspectionId" required>
                <option th:each="inspection : ${inspections}"
                        th:value="${inspection.id}"
                        th:text="${(inspection.organization != null ? inspection.organization.name : 'Организация') + ' — ' + inspection.scheduledDate}"
                        th:selected="${violation.inspection != null && violation.inspection.id == inspection.id}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Описание *</label>
            <textarea id="description" name="description" required th:text="${violation.description}"></textarea>
        </div>

        <div class="form-group">
            <label for="severity">Серьёзность *</label>
            <select id="severity" name="severity" required>
                <option value="minor" th:selected="${violation.severity == 'minor'}">Незначительное</option>
                <option value="moderate" th:selected="${violation.severity == 'moderate'}">Умеренное</option>
                <option value="major" th:selected="${violation.severity == 'major'}">Серьёзное</option>
                <option value="critical" th:selected="${violation.severity == 'critical'}">Критическое</option>
            </select>
        </div>

        <div class="form-group">
            <label for="resolved">Статус устранения</label>
            <select id="resolved" name="resolved">
                <option value="false" th:selected="${!violation.resolved}">Не устранено</option>
                <option value="true" th:selected="${violation.resolved}">Устранено</option>
            </select>
        </div>

        <button type="submit" class="btn manage-violations">Сохранить</button>
    </form>
</main>
