<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Организация - СанЭпидЦентр</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <h1 class="logo">СанЭпидЦентр</h1>
                <ul class="nav-links">
                    <li><a th:href="@{/}">Главная</a></li>
                    <li><a th:href="@{/organizations}">Организации</a></li>
                    <li><a th:href="@{/inspections}">Проверки</a></li>
                    <li><a th:href="@{/violations}">Нарушения</a></li>
                    <li class="admin-only" style="display:none;"><a th:href="@{/register}">Добавить пользователя</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="page-header">
            <h2>Форма организации</h2>
            <a th:href="@{/organizations}" class="btn">Назад к списку</a>
        </section>

        <form id="organizationForm" onsubmit="handleSave(event)">
            <input type="hidden" id="orgId" name="id" th:value="${orgId}">
            
            <div class="form-group">
                <label for="name">Название *</label>
                <input type="text" id="name" name="name" required placeholder="Полное название организации">
            </div>
            
            <div class="form-group">
                <label for="shortName">Краткое название</label>
                <input type="text" id="shortName" name="shortName" placeholder="ООО, ИП и т.д.">
            </div>
            
            <div class="form-group">
                <label for="registrationNumber">Регистрационный номер</label>
                <input type="text" id="registrationNumber" name="registrationNumber" placeholder="ИНН/ОГРН">
            </div>
            
            <div class="form-group">
                <label for="typeId">Тип организации *</label>
                <select id="typeId" name="type.id" required>
                    <option value="">Выберите тип</option>
                    <option th:each="type : ${organizationTypes}"
                            th:value="${type.id}"
                            th:text="${type.name}"></option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="address">Адрес *</label>
                <input type="text" id="address" name="address" required placeholder="Юридический адрес">
            </div>
            
            <div class="form-group">
                <label for="city">Город *</label>
                <input type="text" id="city" name="city" required placeholder="Город">
            </div>
            
            <div class="form-group">
                <label for="directorName">Руководитель *</label>
                <input type="text" id="directorName" name="directorName" required placeholder="ФИО руководителя">
            </div>
            
            <div class="form-group">
                <label for="phone">Телефон *</label>
                <input type="tel" id="phone" name="phone" required placeholder="+7 (___) ___-__-__">
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="example@mail.ru">
            </div>
            
            <div class="form-group">
                <label for="employeeCount">Количество сотрудников</label>
                <input type="number" id="employeeCount" name="employeeCount" min="0" value="0">
            </div>
            
            <div class="form-group">
                <label for="riskCategory">Категория риска *</label>
                <select id="riskCategory" name="riskCategory" required>
                    <option value="low">Низкий</option>
                    <option value="medium" selected>Средний</option>
                    <option value="high">Высокий</option>
                    <option value="critical">Критический</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="notes">Примечания</label>
                <textarea id="notes" name="notes" rows="4" placeholder="Дополнительная информация"></textarea>
            </div>
            
            <div id="errorMessage" class="error-message" style="display:none; color: red; margin-bottom: 1rem;"></div>
            
            <button type="submit" class="btn">Сохранить</button>
        </form>
    </main>

    <footer>

    <script th:src="@{/js/auth.js}"></script>
    <script>document.addEventListener('DOMContentLoaded', function () { requireAuth(); });</script>
</body>
</html>
